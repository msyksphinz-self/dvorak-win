name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: dvorak-win
          path: target/release/dvorak-win.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/dvorak-win.exe
